[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guheadlines"
version = "1.0.0"
description = "Self-hosted Guam news aggregator: hourly incremental scraping, images, intros and full-text search."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins live in requirements.txt (used by the Docker image).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guheadlines = "guheadlines.cli:main"

[tool.setuptools.packages.find]
include = ["guheadlines*"]

[tool.setuptools.package-data]
guheadlines = [
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
