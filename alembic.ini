# Used for development (e.g. `alembic revision -m "..."`).
# In production run `guheadlines migrate`, which configures Alembic itself.
[alembic]
script_location = guheadlines/migrations
# sqlalchemy.url is taken from DATABASE_URL / POSTGRES_* env vars.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
