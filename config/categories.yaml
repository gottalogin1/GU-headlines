  # Stories from Saipan and the rest of the Commonwealth of the Northern
  # Mariana Islands (Saipan Tribune, Marianas Variety and the regional outlets).
  # A single mention is enough, so a Saipan story never lands in Local (Guam).
  - slug: cnmi
    name: Saipan & CNMI
    description: Saipan, Tinian, Rota and the rest of the Northern Mariana Islands.
    min_score: 1
    keywords:
      - Saipan
      - Tinian
      - Rota
      - CNMI
      - Northern Mariana*
      - Commonwealth of the Northern Mariana Islands
      - Garapan
      - Susupe
      - Chalan Kanoa
      - Marianas Visitors Authority
      - MVA

  # Posts from Guam's online community (the r/guam source in sources.yaml
  # puts its posts here). No keywords: news stories are never sorted into it.
  - slug: community
    name: Community
    description: Questions, tips and discussion from Guam's online community on Reddit (r/guam).
