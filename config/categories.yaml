# Topic categories. An article can belong to several.
#
# Each keyword is matched case-insensitively on whole words; a trailing * matches
# any ending ("employ*" matches employer, employment, ...). Accents are ignored.
#
# Scoring: a keyword found in the headline scores 3, in the site's own
# section/tags/URL scores 2, in the intro paragraph scores 1. A category is
# applied when its score reaches min_score (default 3). Sources can also force
# a category (see categories: in sources.yaml).
#
# The category marked fallback: true is applied when nothing else matched.
# After changing this file, re-tag existing articles with:
#     docker compose exec worker guheadlines reclassify

