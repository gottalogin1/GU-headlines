# Calendars for the Events page.
#
# The worker reads them every EVENTS_INTERVAL_HOURS (default 3) and keeps the
# events of the next 90 days. Changes take effect on the next check. Try a
# calendar (nothing is saved) with:
#     docker compose exec worker guheadlines events --check --source <slug>
#
# A calendar is read from one or more inputs. Each input is a kind of address:
#   google_calendar  a public Google Calendar's ID (it looks like an email
#                    address). Read through Google's Calendar API, which needs
#                    GOOGLE_CALENDAR_API_KEY in your .env file (see .env.example).
#   ical             an iCal (.ics) address, the format calendar apps share
#                    calendars in ("Subscribe", "Export" or "iCal feed" links).
#   moderncampus     the RSS feed of a calendar built with Modern Campus (its
#                    "Add to RSS" link), like the University of Guam's.
#   posts            the RSS feed of a site's posts (news or announcements)
#                    that write the event's date in the text, like "on
#                    Saturday, December 12th, at 10:00 AM". Each post with a
#                    date becomes an event on that day; posts without one are
#                    skipped. If the same day's calendar entry has the same
#                    name, the entry is kept and links to the post instead.
#   agendas          a page that lists meeting agendas (PDFs) under dated
#                    headings, like the Legislature's session agendas.
#   notices          a notices.guam.gov listing: GovGuam's public meeting notices.
#   pages            a web page that lists events. Needs CSS selectors:
#                      item         each event on the page
#                      title        the event's name and link inside an item
#                      when         where the item's date and time are written
#                      description  (optional) its short description
#
# Other options:
#   homepage        the calendar's own page, linked from the Events page
#   location        where events are, when an event doesn't say
#   organizer       who holds the events, when an event doesn't say
#   exclude         leave out events whose title or organizer matches one of
#                   these patterns (regular expressions, any upper/lower case)
#   main_events     which of its events go on the month calendar at the top of
#                   the Events page (all of them are always in the list below
#                   it): all (the default), none, a list of patterns (only
#                   events whose title matches one), or "except:" and a list
#                   of patterns (all events but those whose title matches one)
#   color           the colour of its events on the month calendar: green, red,
#                   blue or purple. Leave it out for the plain colour.
#   news_feed       true to also show its events in the news feed on the home
#                   page: each event appears there at 6 in the morning the day
#                   before it (or as soon as it is found, if that's later),
#                   linked to its page on this site, and leaves the feed when
#                   it is over. Only its main events (see main_events).
#   free_admission  true when every event on the calendar costs nothing to
#                   attend, like the government's public meetings, which the
#                   law keeps open to anyone. Each event's page then says
#                   "Admission: Free", and Google is told the price is $0.
#                   Leave it out when you are not sure. (An event whose own
#                   description says it is free, like "free and open to the
#                   public", is marked free anyway, unless it also gives a
#                   price.)
#   request_delay   seconds between requests to this site
#   ignore_robots   read this site even where its robots.txt disallows it
#   cannot_scrape   why this calendar can't be collected; it is never read and
#                   not shown on the site. Delete the line to try it again.
#   enabled         false to pause a calendar without deleting its events
#
# Events whose title says they were cancelled or postponed are left out.
#
# The month calendar shows at most 3 events a day (with "+2 more" and so on),
# all-day events first. An event that lasts more than a week is shown on its
# first day only. When a visitor narrows the page to one calendar or searches
# for a word, the month calendar shows every matching event.
#
# Looked at but not added: the Guam Daily Post's calendar (empty), the Guam
# Department of Labor (no upcoming events, and its calendar export is turned
# off), USO Guam (only a monthly programs flyer), Pacific Historic Parks (no
# Guam events listed), and the Guam Visitors Bureau and Guampedia calendars
# (their firewalls turn away automated visitors).

# Leave out, from every calendar, events whose title, organizer, place or
# description matches one of these patterns (any upper/lower case).
exclude:
  - "chamber of commerce"
  - "guam chamber"

calendars:
  - slug: legislature
    name: Guam Legislature
    homepage: https://guamlegislature.gov/calendar/
    # The calendar on the Legislature's website is this Google Calendar.
    google_calendar: webmaster@guamlegislature.com
    # Session agendas are linked to the session on the calendar.
    agendas: https://guamlegislature.gov/agendas-and-votes/
    location: Guam Congress Building, Hagåtña
    organizer: Guam Legislature
    # The calendar also lists every presentation of a legislative certificate
    # to a person or group. Delete these lines to show them too.
    exclude:
      - "presentation (notice )?(for|of) (legislative )?certificate"
    color: red
    # Sessions and hearings are public meetings, open to anyone at no cost.
    free_admission: true
    # guamlegislature.gov's robots.txt asks for 20 seconds between requests.
    request_delay: 20

  - slug: govguam-meetings
    name: GovGuam public meetings
    homepage: https://notices.guam.gov/notices?type_id=5&view=list
    # The government's official meeting notices (boards, commissions, agencies).
    notices: https://notices.guam.gov/notices?type_id=5&view=list
    # The Legislature's own calendar (above) already lists its sessions and
    # hearings.
    exclude:
      - "^(guam legislature|i liheslaturan gu[aå]han)"
      - "call to session"
    # Routine board meetings: listed below the month calendar, not on it.
    main_events: none
    # Public meetings, open to anyone at no cost.
    free_admission: true

  - slug: gcc
    name: Guam Community College
    homepage: https://guamcc.edu/events/list
    pages: https://guamcc.edu/events/list
    item: article.post
    title: h2.post-title a
    when: ul.ec-directory-option li
    description: .post-body
    location: Guam Community College, Mangilao
    organizer: Guam Community College
    color: blue

  - slug: uog
    name: University of Guam
    homepage: https://www.uog.edu/calendar/
    # The "Add to RSS" link on the calendar page. It lists the coming year's
    # events (about 100 KB). The calendar's "Outlook/iCAL" link gives the same
    # events, but it also holds every past event since 2023 (2.5 MB), so the
    # RSS feed is read instead.
    moderncampus: https://api.calendar.moderncampus.net/pubcalendar/1e1f6d17-b483-4b69-bd50-9d8478fae2b6/rss?category=09a9d4a6-3cdd-4ab3-9d45-bfb690a7ae8f&url=https%3A%2F%2Fwww.uog.edu%2Fcalendar%2F&hash=true
    organizer: University of Guam
    # Thesis defenses and course evaluations are in the list, not on the
    # month calendar.
    main_events:
      except:
        - "thesis defense"
        - "dissertation defense"
        - "^evaluations\\b"
    color: green

  - slug: lits
    name: Life in the Son Christian Fellowship
    homepage: https://www.lifeinthesonguam.org/events
    # The church's Events page has two parts. Its "Event Calendar" is this
    # public Google Calendar (read with GOOGLE_CALENDAR_API_KEY, like the
    # Legislature's), and its "Events & Announcements" are blog posts, read
    # from the blog's feed: a post that gives a date ("Saturday, December
    # 12th, starting at 10:00 AM") is an event that day. The same posts are
    # also stories in the news (the lits news source in sources.yaml).
    google_calendar: litsguampodcast@gmail.com
    posts: https://www.lifeinthesonguam.org/blog-feed.xml
    location: Life in the Son, 134 Tun Vicente Leon Guerrero Dr, Tamuning
    organizer: Life in the Son Christian Fellowship
    color: purple
    # Its events also appear in the news feed on the home page, the day before.
    news_feed: true
