# Self-hosted stack: PostgreSQL + website + hourly scraper, with Caddy in front
# of the website.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD
#   docker compose up -d --build
#
# Website: http://<server> (port 80). With SITE_DOMAIN set in .env and the
# domain pointing at this server: https://<your domain>, with a free
# certificate that Caddy gets and renews by itself.
#
# Your own mail server and webmail (the "mailserver" and "webmail" services
# at the end) start only with COMPOSE_PROFILES=mail in .env. See
# docs/email-server.md.
#
# The "backup" service backs up the whole site every night, in backups/site.
# See docs/maintenance.md#backups.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guheadlines}
      POSTGRES_USER: ${POSTGRES_USER:-guheadlines}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  web:
    build: .
    image: guheadlines:latest
    restart: unless-stopped
    command: ["guheadlines", "web", "--workers", "2"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      BACKUP_DIR: /data/backups
    # No ports: visitors reach the site only through Caddy (below), which
    # talks to it inside Docker's own network at web:8000.
    volumes:
      - media:/data/media
      - ./config:/app/config:ro
      # The nightly backups, read-only: the private stats page (/stats) lists
      # them and offers them for download.
      - ./backups/site:/data/backups:ro
    depends_on:
      db:
        condition: service_healthy
    # The site and the scraper need no special Linux permissions, so all are refused.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  worker:
    build: .
    image: guheadlines:latest
    restart: unless-stopped
    command: ["guheadlines", "worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - media:/data/media
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      disable: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    # The front door: answers visitors on ports 80 (http) and 443 (https) and
    # passes each request on to the website. See caddy/Caddyfile.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3, the newest and fastest way browsers connect
    environment:
      # Empty SITE_DOMAIN: plain http on port 80 for any address, such as the
      # server's IP address. A domain: https for that domain.
      SITE_ADDRESS: ${SITE_DOMAIN:-:80}
      # The webmail's address, which also gets Caddy a certificate that the
      # mail server uses. Without MAIL_HOSTNAME: a name that does not exist
      # (".invalid" names never do), over plain http, so Caddy asks for no
      # certificate.
      WEBMAIL_ADDRESS: ${MAIL_HOSTNAME:-http://mail.invalid}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates. Keep this volume: without it Caddy asks for new
      # certificates on every start, and Let's Encrypt limits how many it gives.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    cap_drop: [ALL]
    # Ports below 1024 (80 and 443) need this one permission.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  backup:
    # Backs up the whole site every night at BACKUP_TIME (Guam time): the
    # database, the photos, .env, the config folder, Caddy's certificates and,
    # with your own mail server, the mailboxes. Each backup is a folder in
    # backups/site, kept for BACKUP_KEEP_DAYS days. To back up now, download a
    # backup, or put one back: scripts/site-backup.sh. It uses the database's
    # own image, which has the database's backup programs (pg_dump, psql).
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/site/scripts/backup-service.sh"]
    command: ["daemon"]
    # Stops at once when asked (it is asleep most of the time).
    init: true
    environment:
      TZ: Pacific/Guam
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-guheadlines}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-guheadlines}
      # Empty BACKUP_TIME (set, but with no value): no nightly backups.
      BACKUP_TIME: ${BACKUP_TIME-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      # The GU-headlines folder, read-only: .env, config/, and the script.
      - .:/site:ro
      - ./backups:/backups
      - media:/volumes/media
      - caddy_data:/volumes/certificates
      # Your own mail server's storage. Empty while the mail server is off;
      # empty storage is not backed up.
      - mail_data:/volumes/mail
      - mail_config:/volumes/mail-settings
      - webmail_db:/volumes/webmail
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    # Reading every file it backs up (some belong to other users), and giving
    # the backups to the website's user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]

  # ---------------------------------------------------------------------------
  # Your own mail server (docker-mailserver) and webmail (Roundcube).
  # Off until .env has COMPOSE_PROFILES=mail and MAIL_HOSTNAME. Step by step:
  # docs/email-server.md. Mailboxes and DNS records: scripts/mail.sh.
  # ---------------------------------------------------------------------------
  mailserver:
    # Receives mail for your addresses, sends mail (from the site and from
    # you), keeps the mailboxes, signs outgoing mail (DKIM) and filters spam
    # (Rspamd). The ":17" tag gets security fixes; scripts/auto-update.sh
    # downloads them once a week.
    image: mailserver/docker-mailserver:17
    profiles: [mail]
    restart: unless-stopped
    # The mail server's own name, such as mail.guamheadlines.com. Your MX
    # record and the server's reverse DNS point at it.
    hostname: ${MAIL_HOSTNAME:-mail.localhost}
    ports:
      - "25:25" # mail from other mail servers to your addresses
      - "465:465" # sending from mail apps (encrypted from the start)
      - "587:587" # sending from mail apps and from the site (STARTTLS)
      - "993:993" # reading mail in mail apps (IMAP, encrypted)
    environment:
      TZ: Pacific/Guam
      # The certificate is the one Caddy gets for the webmail address (the
      # same name), read from Caddy's storage. Only Let's Encrypt issues it
      # (see caddy/Caddyfile), so the path stays the same. The mail server
      # notices when Caddy renews it.
      SSL_TYPE: manual
      SSL_CERT_PATH: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MAIL_HOSTNAME:-mail.localhost}/${MAIL_HOSTNAME:-mail.localhost}.crt
      SSL_KEY_PATH: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MAIL_HOSTNAME:-mail.localhost}/${MAIL_HOSTNAME:-mail.localhost}.key
      # Rspamd filters spam and signs mail with DKIM. The older programs
      # that it replaces stay off. ClamAV (virus scanning) stays off: it
      # needs about 1.5 GB of memory.
      ENABLE_RSPAMD: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_AMAVIS: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      # Spam goes to the Junk folder. Moving a message into or out of Junk
      # teaches the filter.
      MOVE_SPAM_TO_JUNK: 1
      RSPAMD_LEARN: 1
      # Fail2Ban blocks addresses that keep guessing passwords.
      ENABLE_FAIL2BAN: 1
      # A mailbox sends only as its own address (or its aliases).
      SPOOF_PROTECTION: 1
      ENABLE_POP3: 0
      ENABLE_MANAGESIEVE: 0
      # Docker's own network has IPv4 only. Some servers have IPv6 switched
      # off completely, and then the mail programs would not start at all.
      POSTFIX_INET_PROTOCOLS: ipv4
      DOVECOT_INET_PROTOCOLS: ipv4
      # New versions come through scripts/auto-update.sh, not by email.
      ENABLE_UPDATE_CHECK: 0
      # Largest email accepted: 35 MB, room for a 25 MB attachment.
      POSTFIX_MESSAGE_SIZE_LIMIT: 36700160
    volumes:
      - mail_data:/var/mail # the mailboxes
      - mail_state:/var/mail-state # spam filter data, mail waiting to go out
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver # accounts, aliases, DKIM keys
      - ./mail/fail2ban-jail.cf:/tmp/docker-mailserver/fail2ban-jail.cf:ro
      # Caddy's certificates, read-only.
      - caddy_data:/caddy-data:ro
    networks:
      default:
        # Inside Docker, the mail server's name leads straight to this
        # container. The site and the webmail connect to it by that name,
        # and its certificate matches.
        aliases:
          - ${MAIL_HOSTNAME:-mail.localhost}
    # Fail2Ban needs this permission to block addresses.
    cap_add: [NET_ADMIN]
    stop_grace_period: 1m
    depends_on:
      caddy:
        condition: service_started

  webmail:
    # Roundcube: read and write your mail in the browser, at
    # https://<MAIL_HOSTNAME>. Caddy passes the visits on; it has no port of
    # its own.
    image: roundcube/roundcubemail:1.7.x-apache
    profiles: [mail]
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://${MAIL_HOSTNAME:-mail.localhost}
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://${MAIL_HOSTNAME:-mail.localhost}
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,markasjunk
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 18M
    volumes:
      - webmail_db:/var/roundcube/db # settings and contacts
      - ./mail/roundcube.php:/var/roundcube/config/guheadlines.php:ro
    depends_on:
      mailserver:
        condition: service_started
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:
  webmail_db:
