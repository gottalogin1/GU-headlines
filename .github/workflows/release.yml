name: Release

# Publishes a GitHub release when a version tag (e.g. v1.0.0) is pushed, or when
# run from the Actions tab (which also creates the tag on the chosen branch).
# The tag must match the version in pyproject.toml, and the release notes are
# that version's section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # "1.0.0" is titled "1.0"; "1.2.3" keeps all three parts.
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "GU Headlines ${VERSION%.0}" \
            --notes-file "$RUNNER_TEMP/notes.md"
