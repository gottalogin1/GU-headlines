name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guheadlines_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]" ruff
      - name: Lint
        run: |
          ruff check guheadlines tests
          ruff format --check guheadlines tests
          shellcheck scripts/*.sh
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guheadlines_test
        run: pytest -q

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build and start the stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-p@ss\/word/' .env
          sed -i 's/^SCRAPE_ON_START=.*/SCRAPE_ON_START=false/' .env
          docker compose up -d --build
      - name: Wait for the website
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/healthz; then echo; exit 0; fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Pages respond
        run: |
          for path in / /category/military /category/labor "/search?q=guam" /archive /jobs /events /bids /status /robots.txt /sitemap.xml /feed.xml /favicon.ico /static/style.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost$path")
            echo "$path -> $code"
            test "$code" = 200
          done
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost/nope)" = 404
      - name: Only Caddy is reachable from outside Docker
        run: |
          if curl -s --max-time 5 http://localhost:8000/healthz; then
            echo "the website answers on port 8000; it should be reachable only through Caddy"
            exit 1
          fi
          if curl -s -D - -o /dev/null http://localhost/ | grep -i '^server:'; then
            echo "the site names its web server software"
            exit 1
          fi
      - name: Huge uploads are refused
        run: |
          # 21 MB: over the 20 MB that Caddy (caddy/Caddyfile) and the site
          # (MAX_REQUEST_BYTES) take. Caddy starting at all shows that the
          # Caddyfile with its request_body limit is valid.
          head -c 22020096 /dev/zero > big.bin
          for path in / /advertise/booking/x/again; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Origin: http://localhost" \
              --data-binary @big.bin "http://localhost$path")
            echo "21 MB upload to $path -> $code"
            test "$code" = 413
          done
          rm big.bin
      - name: https with a domain
        run: |
          # "localhost" gets a certificate from Caddy's own local authority
          # instead of Let's Encrypt, which is enough to test the https path.
          sed -i 's/^SITE_DOMAIN=.*/SITE_DOMAIN=localhost/' .env
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsSk https://localhost/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsSk -D - -o /dev/null https://localhost/ | grep -i '^strict-transport-security: max-age='
          test "$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" http://localhost/jobs)" = "308 https://localhost/jobs"
      - name: Mail server stays off unless asked for
        run: |
          # The mail server and webmail start only with COMPOSE_PROFILES=mail
          # (docs/email-server.md). Check that they did not start, and that
          # their settings are valid when they are on.
          test -z "$(docker compose ps -aq mailserver webmail)"
          COMPOSE_PROFILES=mail MAIL_HOSTNAME=mail.example.com docker compose config -q
          COMPOSE_PROFILES=mail MAIL_HOSTNAME=mail.example.com docker compose config --services | grep -qx mailserver
          COMPOSE_PROFILES=mail MAIL_HOSTNAME=mail.example.com docker compose config --services | grep -qx webmail
      - name: Worker commands
        run: |
          docker compose exec -T worker guheadlines migrate
          docker compose exec -T worker guheadlines sources
      - name: Back up, export and restore the whole site
        run: |
          # The backup service runs and waits for the night.
          test "$(docker compose ps --format '{{.State}}' backup)" = running
          ./scripts/site-backup.sh now
          ./scripts/site-backup.sh list
          name=$(ls backups/site | grep -E '^[0-9]{4}-' | tail -n 1)
          test -n "$name"
          grep -qx "result=ok" backups/site/status
          # Only the website's user (and root) can open a backup: it holds .env.
          test "$(stat -c '%u %a' "backups/site/$name")" = "10001 700"
          sudo test -s "backups/site/$name/database.sql.gz"
          sudo cmp .env "backups/site/$name/env"
          ./scripts/site-backup.sh export "$name"
          tar -tf "backups/site-backup-$name.tar" | grep -qx "site-backup-$name/database.sql.gz"
          # Something newer than the backup, which the restore takes away.
          docker compose exec -T db psql -U guheadlines -c "CREATE TABLE after_backup (x int)"
          ./scripts/site-backup.sh restore "backups/site-backup-$name.tar" --yes
          test -z "$(docker compose exec -T db psql -U guheadlines -tAc "SELECT to_regclass('after_backup')")"
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/healthz; then echo; exit 0; fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Container logs
        if: always()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v
