name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guheadlines_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]" ruff
      - name: Lint
        run: |
          ruff check guheadlines tests
          ruff format --check guheadlines tests
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guheadlines_test
        run: pytest -q

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-p@ss\/word/' .env
          sed -i 's/^SCRAPE_ON_START=.*/SCRAPE_ON_START=false/' .env
          docker compose up -d --build
      - name: Wait for the website
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then echo; exit 0; fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Pages respond
        run: |
          for path in / /category/military /category/labor "/search?q=guam" /archive /status /robots.txt /static/style.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000$path")
            echo "$path -> $code"
            test "$code" = 200
          done
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/nope)" = 404
      - name: Worker commands
        run: |
          docker compose exec -T worker guheadlines migrate
          docker compose exec -T worker guheadlines sources
      - name: Container logs
        if: always()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v
