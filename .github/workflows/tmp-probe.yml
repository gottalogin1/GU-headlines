# Temporary: targeted probes while tuning sources. Removed once done.
name: Temporary probe
on:
  push:
    paths: [".github/workflows/tmp-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: WordPress.com public API for Cloudflare-protected sites
        run: |
          for site in pncguam.com kanditnews.com guambusinessmagazine.com mbjguam.com; do
            echo "=== $site"
            curl -s -w "\nHTTP %{http_code}\n" "https://public-api.wordpress.com/rest/v1.1/sites/$site/posts/?number=2&fields=URL,title,date,excerpt,featured_image,categories" | head -c 1500
            echo
            curl -s -o /dev/null -w "wp/v2: HTTP %{http_code}\n" "https://public-api.wordpress.com/wp/v2/sites/$site/posts?per_page=1"
          done
